services:
  inventoryservice:
    cpus: ${BENCHMARK_SERVICE_CORES}
    ports: !override
      - "9092:9092"
    restart: "no"

  orderservice:
    cpus: ${BENCHMARK_SERVICE_CORES}
    ports: !override
      - "9091:9091"
    restart: "no"

  loadgen:
    image: grafana/k6:0.55.2
    cpus: ${BENCHMARK_LOADGEN_CORES}
    user: "0:0"
    profiles: [benchmark]
    environment:
      BENCHMARK_DURATION: ${BENCHMARK_DURATION}
      BENCHMARK_MAX_VUS: ${BENCHMARK_MAX_VUS:-4096}
      BENCHMARK_MODE: ${BENCHMARK_MODE:-closed}
      BENCHMARK_PRE_ALLOCATED_VUS: ${BENCHMARK_PRE_ALLOCATED_VUS:-128}
      BENCHMARK_RATE: ${BENCHMARK_RATE:-0}
      BENCHMARK_RESULT_FILE: ${BENCHMARK_RESULT_FILE}
      BENCHMARK_TARGET: http://orderservice:9091/v1/processorder
      BENCHMARK_VUS: ${BENCHMARK_VUS}
    volumes:
      - ${BENCHMARK_DIR}/load.js:/scripts/load.js:ro
      - ${BENCHMARK_ARTIFACTS_DIR}:/results
    networks:
      - app_net
    entrypoint: [k6]
    command: [run, /scripts/load.js]
